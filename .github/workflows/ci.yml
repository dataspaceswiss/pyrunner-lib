name: CI

permissions:
  contents: read

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@v6
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install uv
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        version: "latest"
    
    - name: Install dependencies
      run: |
        uv sync --extra dev --locked
    
    - name: Run tests
      run: |
        uv run pytest tests/ -v --cov=src/pyrunner_lib --cov-report=xml --cov-report=html
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v7
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  lineage-compatibility:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        polars-version: ["1.34.0", "1.35.2", "1.36.1", "1.41.2"]

    steps:
    - uses: actions/checkout@v6

    - uses: actions/setup-python@v6
      with:
        python-version: "3.12"

    - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

    - name: Install dependencies
      run: |
        uv sync --extra dev --locked
        uv pip install polars==${{ matrix.polars-version }}

    - name: Run lineage compatibility tests
      run: |
        uv run --no-sync pytest tests/test_input_source_tracer.py -q -o addopts=""

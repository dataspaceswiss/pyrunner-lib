[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyrunner-lib"
version = "0.5.1"
authors = [
  { name="DataSpace", email="info@dataspace.ch" },
]
description = "Dataframe transform runner for DataSpace"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Column lineage reads Polars' internal query plan, which Polars 2 changed (see _SUPPORTED_IR_MAJORS)
    "polars>=1.34.0,<2",
    "pandas>=1.5.0",
    "pyarrow>=23.0.1",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=4.0.0",
    "black>=26.3.1",
    "pygments>=2.20.0",
    "isort>=5.12.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
pyrunner = "pyrunner_lib.__main__:main"

[project.urls]
Repository = "https://github.com/dataspaceswiss/pyrunner-lib"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--cov=pyrunner_lib --cov-report=term-missing --cov-report=html"

[tool.black]
target-version = ["py310"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.0.0",
]
